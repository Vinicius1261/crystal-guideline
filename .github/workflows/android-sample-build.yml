name: Android Sample Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-sample-build.yml'

permissions:
  contents: read

jobs:
  build-sample:
    name: Build standalone Android NDK sample
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Create independent sample library
        run: |
          mkdir -p sample/src
          cat > sample/src/sample.cpp <<'CPP'
          extern "C" int sample_add(int a, int b) {
              return a + b;
          }
          CPP
          cat > sample/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.22.1)
          project(android_sample LANGUAGES CXX)
          add_library(android_sample SHARED src/sample.cpp)
          set_target_properties(android_sample PROPERTIES
            CXX_STANDARD 17
            CXX_STANDARD_REQUIRED ON)
          CMAKE

      - name: Configure and compile for ARM64 Android
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          cmake -S sample -B sample/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build sample/build --parallel

      - name: Verify output
        run: |
          test -f sample/build/libandroid_sample.so
          file sample/build/libandroid_sample.so

      - name: Upload sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-sample-arm64
          path: sample/build/libandroid_sample.so
          retention-days: 7

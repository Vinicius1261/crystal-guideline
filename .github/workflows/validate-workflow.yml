name: Validate workflow YAML

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-workflow.yml'

permissions:
  contents: read

jobs:
  validate-yaml:
    name: Check validator workflow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate this workflow's YAML syntax
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/validate-workflow.yml"); puts "YAML syntax OK"'
